<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Prospector — Codex Create{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#F3EEFA',
              100: '#E3D6F3',
              200: '#C9B0E6',
              300: '#A88AD4',
              400: '#8B5CF6',
              500: '#6B3FA0',
              600: '#4C2893',
              700: '#3B1F73',
              800: '#2A1652',
              900: '#1E0E3A',
              950: '#0F0620',
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .theme-toggle { transition: transform 0.3s ease; }
    .theme-toggle:hover { transform: rotate(30deg); }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col transition-colors">

  <script>
    (function() {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Header -->
  <header class="bg-brand-900 dark:bg-brand-950 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="/static/logotipo-fundo-light.png" alt="Codex Create"
             class="h-16 w-auto rounded-lg object-contain dark:hidden" />
        <img src="/static/logotipo-fundo-dark.png" alt="Codex Create"
             class="h-16 w-auto rounded-lg object-contain hidden dark:block" />
        <div>
          <span class="text-white font-bold text-lg leading-tight block">Prospector</span>
          <span class="text-brand-300 text-xs font-medium">Codex Create</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <nav class="flex gap-1">
          <a href="/"
             class="px-4 py-2 rounded-lg text-sm font-medium text-brand-200 hover:text-white hover:bg-brand-800 transition-colors
                    {% if request.url.path == '/' %}bg-brand-800 text-white{% endif %}">
            Buscar
          </a>
          <a href="/historico"
             class="px-4 py-2 rounded-lg text-sm font-medium text-brand-200 hover:text-white hover:bg-brand-800 transition-colors
                    {% if request.url.path == '/historico' %}bg-brand-800 text-white{% endif %}">
            Histórico
          </a>
        </nav>
        <button id="themeToggle" type="button"
          class="ml-2 p-2 rounded-lg text-brand-200 hover:text-white hover:bg-brand-800 transition-colors theme-toggle"
          aria-label="Alternar modo escuro">
          <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-brand-950 border-t border-gray-200 dark:border-brand-900 mt-auto transition-colors">
    <div class="max-w-7xl mx-auto px-4 py-3 text-center text-xs text-gray-400 dark:text-gray-500">
      Codex Create — Uso interno &middot; Prospector v1.1
    </div>
  </footer>

  <script>
    (function() {
      const toggle = document.getElementById('themeToggle');
      const sun = document.getElementById('sunIcon');
      const moon = document.getElementById('moonIcon');
      const html = document.documentElement;

      function setTheme(dark) {
        if (dark) {
          html.classList.add('dark');
          sun.classList.remove('hidden');
          moon.classList.add('hidden');
          localStorage.setItem('theme', 'dark');
        } else {
          html.classList.remove('dark');
          sun.classList.add('hidden');
          moon.classList.remove('hidden');
          localStorage.setItem('theme', 'light');
        }
      }

      toggle.addEventListener('click', function() {
        setTheme(!html.classList.contains('dark'));
      });

      if (html.classList.contains('dark')) {
        sun.classList.remove('hidden');
        moon.classList.add('hidden');
      }
    })();
  </script>

</body>
</html>
