{% extends "base.html" %}
{% block title %}Sem conexão — Prospector Codex Create{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-16">
  <div class="w-16 h-16 bg-indigo-50 dark:bg-[#251f45] rounded-full flex items-center justify-center mx-auto mb-4">
    <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M18.364 5.636a9 9 0 010 12.728m-3.536-3.536a4 4 0 010-5.656M12 12a1 1 0 100-2 1 1 0 000 2zM3 3l18 18"/>
    </svg>
  </div>
  <h1 class="text-gray-800 dark:text-[#e2e1f0] font-semibold text-lg mb-1">Você está sem conexão</h1>
  <p class="text-gray-500 dark:text-[#8c8ba8] text-sm">
    Não foi possível carregar esta página. Buscas, histórico e exportação precisam de internet —
    verifique sua conexão e tente novamente.
  </p>
  <button type="button" onclick="window.location.reload()"
    class="mt-5 inline-flex items-center justify-center min-h-[44px] px-5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm transition-colors">
    Tentar novamente
  </button>
</div>
{% endblock %}
