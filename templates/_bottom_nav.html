<nav
  id="bottomNav"
  class="lg:hidden fixed inset-x-0 bottom-0 z-40 bg-white dark:bg-[#17162a] border-t border-gray-200 dark:border-[#252340] shadow-[0_-2px_10px_rgba(0,0,0,0.05)]"
  style="padding-bottom: env(safe-area-inset-bottom);"
  aria-label="Navegação principal"
>
  <div class="flex items-stretch">
    <a href="/" aria-current="{{ 'page' if request.url.path == '/' else 'false' }}"
       class="bn-item {{ 'is-active' if request.url.path == '/' else '' }}">
      <span class="bn-icon-wrap">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </span>
      <span>Buscar</span>
    </a>

    <a href="/historico" aria-current="{{ 'page' if request.url.path == '/historico' else 'false' }}"
       class="bn-item {{ 'is-active' if request.url.path == '/historico' else '' }}">
      <span class="bn-icon-wrap">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </span>
      <span>Histórico</span>
    </a>

    <a href="/export" class="bn-item">
      <span class="bn-icon-wrap">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
      </span>
      <span>Exportar</span>
    </a>

    {% if current_user and current_user.role == 'admin' %}
    <a href="/admin/users" aria-current="{{ 'page' if request.url.path == '/admin/users' else 'false' }}"
       class="bn-item {{ 'is-active' if request.url.path == '/admin/users' else '' }}">
      <span class="bn-icon-wrap">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-4a4 4 0 10-4-4 4 4 0 004 4zm6 0a4 4 0 10-4-4"/>
        </svg>
      </span>
      <span>Usuários</span>
    </a>
    {% endif %}

    <button type="button" id="profileNavBtn" class="bn-item">
      <span class="bn-icon-wrap">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </span>
      <span>Perfil</span>
    </button>
  </div>
</nav>
